name: Deploy Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Deploy: syncs ./dist/ al FTP de Hostinger (puerto 21).
      # Servidor: FTP_SERVER debe ser la IP exacta (ej. 92.112.189.176),
      # SIN ftp:// ni espacios (así se ve en hPanel con el prefijo ftp://).
      # Si quieres cifrar la conexión, cambia protocol: ftp -> ftps.
      # server-dir: la cuenta FTP de Hostinger aterriza en public_html,
      # así que ./ sube directo a la raíz del sitio. Si tu cuenta FTP
      # aterriza en el home que contiene public_html como carpeta,
      # usa la variable de entorno FTP_SERVER_DIR con valor ./public_html/.
      - name: Deploy via FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          local-dir: ./dist/
          exclude: |
            **/.DS_Store
            **/Thumbs.db